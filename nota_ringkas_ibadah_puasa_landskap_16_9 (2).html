    .nota-stage-card {

    /* Pada Tablet (>= 640px), Desktop, atau Telefon Melintang (Landscape): Kunci nisbah aspek 16:9 */

      .nota-stage-card {
        min-height: 0;

    }

    /* Pengoptimuman sentuhan untuk butang dan kad interaktif pada telefon & tablet */
    button,

      function updateUnderstandingUI() {
        starCountValue.textContent = understoodPages.size;
        const isCurrentUnderstood = understoodPages.has(currentPageIndex);

        if (isCurrentUnderstood) {
          markUnderstoodBtn.className = 'inline-flex items-center justify-center gap-1 px-2.5 py-1.5 sm:py-1 rounded-xl sm:rounded-lg font-extrabold text-xs transition active:scale-95 cursor-pointer shrink-0 shadow-xs bg-gradient-to-r from-[#F4CE6A] to-[#DFAB38] text-[#0A2B24] border border-[#9E7114]';
          markUnderstoodIcon.textContent = '🌟';
          markUnderstoodText.textContent = 'Sudah Difahami!';
        } else {
          markUnderstoodBtn.className = 'inline-flex items-center justify-center gap-1 px-2.5 py-1.5 sm:py-1 rounded-xl sm:rounded-lg font-bold text-xs transition active:scale-95 cursor-pointer shrink-0 shadow-xs bg-[#134F43] hover:bg-[#0D3D33] text-[#FFF9E6] border border-[#E5BF5D]/60';
          markUnderstoodIcon.textContent = '⭐';
          markUnderstoodText.textContent = 'Tandakan Faham';
        }

        // Kemas kini tanda semak pada tab langkah panel sisi
        stepTabBtns.forEach((btn, idx) => {
          const checkEl = btn.querySelector('.step-check');
          const isActiveTab = idx === currentPageIndex;
          if (understoodPages.has(idx)) {
            checkEl.textContent = '✓';
            checkEl.className = isActiveTab
              ? 'step-check text-xs font-extrabold text-[#092B24] shrink-0'
              : 'step-check text-xs font-extrabold text-[#0F5244] shrink-0';
          } else {
            checkEl.textContent = '○';
            checkEl.className = isActiveTab
              ? 'step-check text-xs font-bold text-[#092B24]/75 shrink-0'
              : 'step-check text-xs font-bold text-[#0D3B32]/65 shrink-0';
          }
        });
      }

      /**
       * Memaparkan kandungan halaman nota mengikut indeks (0 - 4)
       */
      function renderNotaPage(index) {
        currentPageIndex = index;
        const page = notaPages[index];

        // Kemas kini penggayaan tab panel topik (mesra sentuhan telefon & tablet)
        stepTabBtns.forEach((btn, idx) => {
          const spanSpanClass = idx === 4 ? ' col-span-2 sm:col-span-1' : '';
          if (idx === index) {
            btn.className = `step-tab-btn${spanSpanClass} px-2.5 sm:px-3 py-2 sm:py-1.5 lg:py-2 rounded-xl text-left border-2 transition cursor-pointer flex items-center justify-between gap-1.5 bg-gradient-to-r from-[#F5D372] via-[#F9E193] to-[#E5B644] text-[#092B24] border-white shadow-md`;
          } else {
            btn.className = `step-tab-btn${spanSpanClass} px-2.5 sm:px-3 py-2 sm:py-1.5 lg:py-2 rounded-xl text-left border transition cursor-pointer flex items-center justify-between gap-1.5 bg-white hover:bg-[#FFFDF6] text-[#0C382F] border-[#DFB654]/60 shadow-xs`;
          }
        });

        // Kemas kini bar kemajuan & titik penunjuk
// ... existing code ...
            <div class="grid grid-cols-1 sm:grid-cols-3 gap-2 sm:gap-2.5 mt-2.5">
              ${page.highlights.map((h, i) => {
                const key = `p0-h-${i}`;
                const activeClass = highlightedCards.has(key) ? 'is-highlighted' : '';
                return `
                  <div data-card-key="${key}" data-sfx="cardTap" class="note-item-card ${activeClass} p-2.5 rounded-xl cursor-pointer">
                    <div class="flex items-center gap-1.5 font-extrabold text-[#0D3B32] text-xs">
                      <span class="text-sm">${h.icon}</span>
                      <span class="truncate">${h.label}</span>
                    </div>
                    <p class="text-[11px] font-medium text-[#223B35] mt-1 leading-snug">${h.desc}</p>
                  </div>
                `;
              }).join('')}
            </div>
          `;
        } else if (page.type === 'rukun') {
// ... existing code ...
        // Pasang pendengar klik (SFX bukan navigasi) pada setiap kad isi nota
        notaPageContent.querySelectorAll('[data-card-key]').forEach((cardEl) => {
          cardEl.addEventListener('click', function () {
            const cardKey = this.getAttribute('data-card-key');
            const sfxType = this.getAttribute('data-sfx') || 'cardTap';
            if (highlightedCards.has(cardKey)) {
              highlightedCards.delete(cardKey);
            } else {
              highlightedCards.add(cardKey);
            }
            playSfx(sfxType);
            renderNotaPage(currentPageIndex);
          });
        });

        updateUnderstandingUI();
        notifyEmbedHeight();
      }

      // Sokongan leretan jari (swipe kiri/kanan) untuk pengguna telefon pintar & tablet
      const notaPageViewport = document.getElementById('notaPageViewport');
      let touchStartX = 0;
      let touchStartY = 0;

      notaPageViewport.addEventListener('touchstart', function (e) {
        if (e.changedTouches && e.changedTouches.length > 0) {
          touchStartX = e.changedTouches[0].clientX;
          touchStartY = e.changedTouches[0].clientY;
        }
      }, { passive: true });

      notaPageViewport.addEventListener('touchend', function (e) {
        if (!e.changedTouches || e.changedTouches.length === 0) return;
        const deltaX = e.changedTouches[0].clientX - touchStartX;
        const deltaY = e.changedTouches[0].clientY - touchStartY;

        // Pastikan gerakan adalah leretan mendatar yang jelas dan bukan skrol menegak
        if (Math.abs(deltaX) > 55 && Math.abs(deltaX) > Math.abs(deltaY) * 1.4) {
          if (deltaX < 0 && currentPageIndex < notaPages.length - 1) {
            playSfx('navNext');
            renderNotaPage(currentPageIndex + 1);
          } else if (deltaX > 0 && currentPageIndex > 0) {
            playSfx('navPrev');
            completionBanner.classList.add('hidden');
            renderNotaPage(currentPageIndex - 1);
          }
        }
      }, { passive: true });

      // Pengendali Butang Navigasi: Sebelumnya
// ... existing code ...
      if (typeof ResizeObserver !== 'undefined') {
        const ro = new ResizeObserver(notifyEmbedHeight);
        ro.observe(document.getElementById('notaLandscapeStage'));
      }

      window.addEventListener('resize', notifyEmbedHeight);
      window.addEventListener('orientationchange', notifyEmbedHeight);

      // Paparkan Halaman 1 sebaik sahaja aplikasi dimuatkan
      renderNotaPage(0);
      notifyEmbedHeight();
    };
